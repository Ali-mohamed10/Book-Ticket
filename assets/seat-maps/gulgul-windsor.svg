<svg width="1400" height="900" viewBox="0 0 1400 900" 
xmlns="http://www.w3.org/2000/svg">
  <!-- BACKGROUND -->
  <rect width="1400" height="900" fill="#111"/>
  <!-- STAGE -->
  <g id="stage">
    <rect x="500" y="40" width="400" height="100" fill="#333" 
rx="12"/>
    <text x="700" y="100" fill="#fff" font-size="26" text-anchor="middle">STAGE</text>
  </g>
  <!-- DANCE FLOOR -->
  <g id="dance_floor">
    <rect x="350" y="200" width="700" height="260" fill="#222" 
stroke="#fff" stroke-width="2" rx="20"/>
    <text x="700" y="330" fill="#fff" font-size="26" text-anchor="middle">DANCE FLOOR</text>
  </g>
  <!-- TRACK FRAME -->
  <g id="track_frame">
    <rect x="300" y="160" width="800" height="340" fill="none" 
stroke="#d4af37" stroke-width="4" rx="30"/>
    <rect x="330" y="190" width="740" height="280" fill="none" 
stroke="#00a86b" stroke-width="3" rx="25"/>
  </g>
  <!-- TOP ROW (GREEN TABLES) -->
  <g id="top_tables">
    <g id="t_top_01"><rect x="360" y="170" width="80" height="80" fill="#00a86b" rx="10"/><text x="400" y="215" fill="#fff" font-size="18" text-anchor="middle">T1</text></g>
    <g id="t_top_02"><rect x="460" y="170" width="80" height="80" fill="#00a86b" rx="10"/><text x="500" y="215" fill="#fff" font-size="18" text-anchor="middle">T2</text></g>
    <g id="t_top_03"><rect x="560" y="170" width="80" height="80" fill="#00a86b" rx="10"/><text x="600" y="215" fill="#fff" font-size="18" text-anchor="middle">T3</text></g>
    <g id="t_top_04"><rect x="660" y="170" width="80" height="80" fill="#00a86b" rx="10"/><text x="700" y="215" fill="#fff" font-size="18" text-anchor="middle">T4</text></g>
    <g id="t_top_05"><rect x="760" y="170" width="80" height="80" fill="#00a86b" rx="10"/><text x="800" y="215" fill="#fff" font-size="18" text-anchor="middle">T5</text></g>
    <g id="t_top_06"><rect x="860" y="170" width="80" height="80" fill="#00a86b" rx="10"/><text x="900" y="215" fill="#fff" font-size="18" text-anchor="middle">T6</text></g>
  </g>
  <!-- LEFT SIDE (GOLD TABLES) -->
  <g id="left_tables">
    <g id="t_left_01"><rect x="320" y="240" width="80" height="80" fill="#d4af37" rx="10"/><text x="360" y="285" fill="#000" font-size="18" text-anchor="middle">G1</text></g>
    <g id="t_left_02"><rect x="320" y="330" width="80" height="80" fill="#d4af37" rx="10"/><text x="360" y="375" fill="#000" font-size="18" text-anchor="middle">G2</text></g>
    <g id="t_left_03"><rect x="320" y="420" width="80" height="80" fill="#d4af37" rx="10"/><text x="360" y="465" fill="#000" font-size="18" text-anchor="middle">G3</text></g>
  </g>
  <!-- RIGHT SIDE (GOLD TABLES) -->
  <g id="right_tables">
    <g id="t_right_01"><rect x="1000" y="240" width="80" 
height="80" fill="#d4af37" rx="10"/><text x="1040" y="285" 
fill="#000" font-size="18" text-anchor="middle">G4</text></g>
    <g id="t_right_02"><rect x="1000" y="330" width="80" 
height="80" fill="#d4af37" rx="10"/><text x="1040" y="375" 
fill="#000" font-size="18" text-anchor="middle">G5</text></g>
    <g id="t_right_03"><rect x="1000" y="420" width="80" 
height="80" fill="#d4af37" rx="10"/><text x="1040" y="465" 
fill="#000" font-size="18" text-anchor="middle">G6</text></g>
  </g>
  <!-- BOTTOM ROW (BLUE TABLES) -->
  <g id="bottom_tables">
    <g id="t_bottom_01"><rect x="360" y="400" width="80" 
height="80" fill="#1e90ff" rx="10"/><text x="400" y="445" 
fill="#fff" font-size="18" text-anchor="middle">B1</text></g>
    <g id="t_bottom_02"><rect x="460" y="400" width="80" 
height="80" fill="#1e90ff" rx="10"/><text x="500" y="445" 
fill="#fff" font-size="18" text-anchor="middle">B2</text></g>
    <g id="t_bottom_03"><rect x="560" y="400" width="80" 
height="80" fill="#1e90ff" rx="10"/><text x="600" y="445" 
fill="#fff" font-size="18" text-anchor="middle">B3</text></g>
    <g id="t_bottom_04"><rect x="660" y="400" width="80" 
height="80" fill="#1e90ff" rx="10"/><text x="700" y="445" 
fill="#fff" font-size="18" text-anchor="middle">B4</text></g>
    <g id="t_bottom_05"><rect x="760" y="400" width="80" 
height="80" fill="#1e90ff" rx="10"/><text x="800" y="445" 
fill="#fff" font-size="18" text-anchor="middle">B5</text></g>
    <g id="t_bottom_06"><rect x="860" y="400" width="80" 
height="80" fill="#1e90ff" rx="10"/><text x="900" y="445" 
fill="#fff" font-size="18" text-anchor="middle">B6</text></g>
  </g>
  <!-- HOST AREA -->
  <g id="host_area">
    <rect x="360" y="680" width="220" height="120" fill="#555" 
rx="10"/>
    <text x="470" y="740" fill="#fff" font-size="20" text-anchor="middle">HOST AREA</text>
  </g>
  <!-- ENTRANCE -->
  <g id="entrance">
    <rect x="640" y="680" width="220" height="120" fill="#666" 
rx="10"/>
    <text x="750" y="740" fill="#fff" font-size="20" text-anchor="middle">ENTRANCE</text>
  </g>
  <!-- WAITING AREA -->
  <g id="waiting_area">
    <rect x="920" y="680" width="220" height="120" fill="#777" 
rx="10"/>
    <text x="1030" y="740" fill="#fff" font-size="20" text-anchor="middle">WAITING AREA</text>
  </g>
</svg>